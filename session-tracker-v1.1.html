<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Session Tracker</title><style> *{box-sizing:border-box}body{margin:0;background:#10151c;color:#f1f5f9;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:520px;margin:auto;padding:24px 18px 48px}h1{font-size:25px;margin:0 0 8px}small,p{color:#a5b3c4}section{background:#1b2430;border:1px solid #303d4b;border-radius:20px;padding:20px;margin:14px 0}#clock{font-size:clamp(45px,13vw,68px);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:16px 0;color:#79e0b2}button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px;background:#344458;color:white;cursor:pointer}button:disabled{opacity:.35}#start{background:#227b58}#stop{background:#813c48}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wide{width:100%;margin-top:10px}progress{width:100%;height:12px;accent-color:#65d4a3} .stats{display:grid;grid-template-columns:1fr 1fr;gap:20px}.num{font-size:25px;font-weight:650;margin-top:5px;font-variant-numeric:tabular-nums}h2{font-size:18px;margin:0 0 12px}.entry{display:flex;justify-content:space-between;border-top:1px solid #344458;padding:12px 0;gap:10px}input{width:100%;background:#10151c;color:white;border:1px solid #536171;padding:10px;border-radius:8px;font:inherit}label{display:block;margin-bottom:8px}#status{text-align:center}  .entry{align-items:center;flex-wrap:wrap}.entry-info{flex:1;min-width:145px}.entry-actions{display:flex;gap:6px}.entry-actions button{padding:10px;font-size:13px}.danger{background:#813c48}dialog{width:min(94vw,480px);max-height:85dvh;overflow:auto;background:#1b2430;color:#f1f5f9;border:1px solid #536171;border-radius:18px;padding:20px}dialog::backdrop{background:#000a}.segment{padding:12px 0;border-top:1px solid #344458}.segment input{margin-bottom:10px;color-scheme:dark;min-width:0}.error{color:#ff9ba7}button{touch-action:manipulation}main{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom))}</style></head><body><main><h1>SESSION TRACKER <small style="font-size:12px">v1.1</small></h1><small id="date"></small><section><div id="status"></div><div id="clock">00:00:00</div><progress id="sessionbar" max="7200000" value="0"></progress><p id="remaining"></p><div class="buttons"><button id="start">Старт</button><button id="pause">Пауза</button><button id="stop">Стоп</button></div><button class="wide" id="break">Разминка · 10 мин</button></section><section><h2>Сегодня</h2><div class="stats"><div><small>Отработано</small><div class="num" id="today"></div></div><div><small>Осталось</small><div class="num" id="left"></div></div><div><small>Сессий</small><div class="num" id="count"></div></div><div><small>План</small><div class="num" id="pct"></div></div></div><progress id="daybar" max="100" value="0"></progress><label for="goal" style="margin-top:15px">Цель сегодня, часов</label><input id="goal" type="number" min="0" max="24" step="0.5"></section><section><h2>Статистика</h2><div class="stats"><div><small>Эта неделя</small><div class="num" id="week"></div></div><div><small>Этот месяц</small><div class="num" id="month"></div></div></div></section><section><h2>История сессий</h2><button id="add" class="wide" style="margin:0 0 12px">+ Добавить сессию вручную</button><div id="history"></div><button id="export" class="wide">Экспорт CSV</button></section><small id="storage"></small></main><dialog id="editor"><h2 id="editorTitle">Редактировать сессию</h2><p>Каждый интервал — чистое рабочее время. Промежутки между ними не учитываются.</p><div id="editSegments"></div><button id="addSegment" class="wide">+ Рабочий интервал</button><p>Чистое время: <strong id="editTotal">00:00:00</strong></p><p id="editError" class="error" role="alert"></p><div class="buttons" style="grid-template-columns:1fr 1fr"><button id="cancelEdit">Отмена</button><button id="saveEdit" style="background:#227b58">Сохранить</button></div></dialog><script>
const $=id=>document.getElementById(id), H=3600000, M=60000, key='sessionTracker.v1';let s={history:[],segments:[],start:null,breakEnd:null,goals:{}};try{const raw=localStorage.getItem(key);if(raw)s=JSON.parse(raw);localStorage.setItem(key,JSON.stringify(s))}catch(e){$('storage').textContent='Хранилище недоступно: история может исчезнуть после закрытия страницы.'}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){$('storage').textContent='Не удалось сохранить данные.'}}function day(t){const d=new Date(t);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function fmt(ms){let n=Math.max(0,Math.floor(ms/1000));return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')}function sum(a){return a.reduce((v,x)=>v+Math.max(0,x[1]-x[0]),0)}function active(n){return [...s.segments,...(s.start===null?[]:[[s.start,n]])]}function close(n){if(s.start!==null){s.segments.push([s.start,n]);s.start=null}}function finish(n){close(n);if(s.segments.length){s.history.push({segments:s.segments});s.segments=[]}}function overlap(a,lo,hi){return a.reduce((v,x)=>v+Math.max(0,Math.min(x[1],hi)-Math.max(x[0],lo)),0)}function render(){const n=Date.now(),d=new Date(n),k=day(n),mid=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),mon=new Date(mid);mon.setDate(mon.getDate()-(d.getDay()+6)%7);const mo=new Date(d.getFullYear(),d.getMonth(),1).getTime(),a=active(n),all=[...s.history.flatMap(x=>x.segments),...a],elapsed=sum(a),today=overlap(all,mid,n),goal=s.goals[k]??([0,7,9,9,9,9,2.5][d.getDay()]),rest=s.breakEnd!==null; if(rest&&n>=s.breakEnd){s.breakEnd=null;save();}const b=s.breakEnd!==null;$('date').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});$('status').textContent=b?'Разминка':s.start!==null?'Сессия идёт':s.segments.length?'На паузе':'Готов к работе';$('clock').textContent=fmt(b?Math.max(0,s.breakEnd-n):elapsed);$('sessionbar').value=Math.min(elapsed,2*H);$('remaining').textContent=b?'Время до конца перерыва':elapsed>=2*H?'Лимит 2 часа достигнут':'До перерыва: '+fmt(2*H-elapsed);$('start').disabled=s.start!==null||b;$('pause').disabled=s.start===null;$('stop').disabled=!a.length&&!b;$('break').disabled=b;$('today').textContent=fmt(today);$('left').textContent=fmt(goal*H-today);$('count').textContent=s.history.filter(x=>overlap(x.segments,mid,n)>0).length;$('pct').textContent=goal?Math.round(today/(goal*H)*100)+'%':'—';$('daybar').value=goal?Math.min(100,today/(goal*H)*100):0;if(document.activeElement!==$('goal'))$('goal').value=goal;$('week').textContent=fmt(overlap(all,+mon,n));$('month').textContent=fmt(overlap(all,mo,n));renderHistory();}

let historySignature=null, editingIndex=null;
function renderHistory(){const signature=JSON.stringify(s.history);if(signature===historySignature)return;historySignature=signature;const root=$('history');root.replaceChildren();if(!s.history.length){root.textContent='Пока нет завершённых сессий.';return;}const sorted=s.history.map((x,i)=>({x,i})).sort((a,b)=>b.x.segments[0][0]-a.x.segments[0][0]);for(const {x,i} of sorted){const row=document.createElement('div');row.className='entry';const info=document.createElement('div');info.className='entry-info';const l=document.createElement('small'),r=document.createElement('div');l.textContent=new Date(x.segments[0][0]).toLocaleString('ru-RU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});r.textContent=fmt(sum(x.segments));r.style.fontWeight='650';info.append(l,r);const actions=document.createElement('div');actions.className='entry-actions';const edit=document.createElement('button'),del=document.createElement('button');edit.textContent='Изменить';del.textContent='Удалить';del.className='danger';edit.onclick=()=>openEditor(i);del.onclick=()=>{if(confirm('Удалить сессию '+l.textContent+' ('+r.textContent+')?')){s.history.splice(i,1);save();render();}};actions.append(edit,del);row.append(info,actions);root.append(row);}}
function localInput(t){const d=new Date(t);return day(t)+'T'+[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
function readEdit(){return [...$('editSegments').children].map(row=>[...row.querySelectorAll('input')].map(input=>new Date(input.value).getTime()));}
function updateEdit(){const a=readEdit();$('editTotal').textContent=fmt(sum(a.filter(x=>x.every(Number.isFinite))));$('editError').textContent='';}
function addSegment(a,b){const row=document.createElement('div');row.className='segment';for(const [label,t] of [['Начало',a],['Окончание',b]]){const l=document.createElement('label'),input=document.createElement('input');l.textContent=label;input.type='datetime-local';input.step='1';input.value=localInput(t);input.oninput=updateEdit;l.append(input);row.append(l);}const remove=document.createElement('button');remove.textContent='Убрать интервал';remove.className='danger';remove.onclick=()=>{row.remove();updateEdit();};row.append(remove);$('editSegments').append(row);updateEdit();}
function openEditor(i){editingIndex=i;$('editorTitle').textContent=i===null?'Новая сессия':'Редактировать сессию';$('editSegments').replaceChildren();const n=Date.now();for(const [a,b] of i===null?[[n-H,n]]:s.history[i].segments)addSegment(a,b);$('editor').showModal();}
$('add').onclick=()=>openEditor(null);$('cancelEdit').onclick=()=>$('editor').close();$('addSegment').onclick=()=>{const a=readEdit(),n=Date.now(),last=a.at(-1)?.[1];const start=Number.isFinite(last)?last:n-H;addSegment(start,Math.max(start+M,Math.min(n,start+H)));};
$('saveEdit').onclick=()=>{const a=readEdit().sort((x,y)=>x[0]-y[0]),n=Date.now();const error=msg=>{$('editError').textContent=msg;};if(!a.length||a.some(x=>!x.every(Number.isFinite)||x[1]<=x[0]))return error('Укажи корректное начало и окончание каждого интервала.');if(a.some(x=>x[1]>n))return error('Окончание не может быть в будущем.');if(a.some((x,i)=>i&&x[0]<a[i-1][1]))return error('Рабочие интервалы пересекаются.');const other=[...s.history.filter((_,i)=>i!==editingIndex).flatMap(x=>x.segments),...active(n)];if(a.some(x=>other.some(y=>x[0]<y[1]&&y[0]<x[1])))return error('Интервал пересекается с другой сессией.');if(editingIndex===null)s.history.push({segments:a});else s.history[editingIndex]={...s.history[editingIndex],segments:a};save();$('editor').close();render();};

$('start').onclick=()=>{s.start=Date.now();save();render()};$('pause').onclick=()=>{close(Date.now());save();render()};$('stop').onclick=()=>{finish(Date.now());s.breakEnd=null;save();render()};$('break').onclick=()=>{finish(Date.now());s.breakEnd=Date.now()+10*M;save();render()};$('goal').onchange=()=>{let x=Number($('goal').value);if(Number.isFinite(x)&&x>=0&&x<=24){s.goals[day(Date.now())]=x;save()}render()};$('export').onclick=()=>{let csv='\ufeffДата начала;Дата окончания;Секунды\n'+s.history.map(x=>[new Date(x.segments[0][0]).toISOString(),new Date(x.segments.at(-1)[1]).toISOString(),Math.floor(sum(x.segments)/1000)].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='sessions.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();setInterval(render,1000);document.addEventListener('visibilitychange',render);
</script></body></html>
